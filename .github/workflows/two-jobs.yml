
name: Two Jobs Workflow

on:
  push:
    branches:
      - master
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Firstjob
        run: echo "Hello from Job 1"

      - name: Finish Firstjob
        run: echo "Job1 completed"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Secondjob
        run: echo "Hello from Job 2"

      - name: Finish Secondjob
        run: echo "Job2 completed"
